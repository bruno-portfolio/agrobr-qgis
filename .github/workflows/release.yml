name: Release

on:
  release:
    types: [published]

jobs:
  release:
    name: Package & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install qgis-plugin-ci
      - name: Package and release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          qgis-plugin-ci package $VERSION
          qgis-plugin-ci release $VERSION --release-tag $TAG --github-token $GITHUB_TOKEN --create-plugin-repo
